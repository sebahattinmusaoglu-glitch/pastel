<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pastel Sudoku Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { 
            margin: 0; padding: 0; overflow: hidden; 
            touch-action: none; -webkit-tap-highlight-color: transparent;
            user-select: none; -webkit-user-select: none;
            font-family: -apple-system, system-ui, sans-serif;
        }
        #root { height: 100vh; display: flex; flex-direction: column; }
        .numpad-btn:active { transform: scale(0.9); opacity: 0.8; }
        /* Çentikli telefonlar için alt boşluk */
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;

        const THEMES = {
          spring: {
            name: "Spring", bg: "#fdf6f0", primary: "#f9a8c9", primaryLight: "#fde8f2",
            text: "#5a3e4b", border: "#f0d4e4", cellBg: "#ffffff", cellSelected: "#fde8f2",
            cellHighlight: "#fef3e8", cellBlock: "#fdf0f6", user: "#c2557a", given: "#5a3e4b"
          },
          ocean: {
            name: "Ocean", bg: "#f0f6fd", primary: "#93c5e8", primaryLight: "#dceefa",
            text: "#2c4a6e", border: "#c8dff2", cellBg: "#ffffff", cellSelected: "#dceefa",
            cellHighlight: "#edf5fc", cellBlock: "#f0f8ff", user: "#2e7abf", given: "#1e3a5a"
          },
          cloudy: {
            name: "Cloudy", bg: "#f4f4f7", primary: "#b8b8d0", primaryLight: "#e8e8f4",
            text: "#3a3a5a", border: "#d8d8e8", cellBg: "#ffffff", cellSelected: "#e8e8f4",
            cellHighlight: "#f0f0f8", cellBlock: "#f5f5fa", user: "#5a5a9a", given: "#2a2a4a"
          }
        };

        const isValid = (board, row, col, num) => {
          for (let i = 0; i < 9; i++) if (board[row][i] === num || board[i][col] === num) return false;
          const startR = Math.floor(row / 3) * 3, startC = Math.floor(col / 3) * 3;
          for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) if (board[startR + r][startC + c] === num) return false;
          return true;
        };

        const fillBoard = (board) => {
          for (let r = 0; r < 9; r++) {
            for (let c = 0; c < 9; c++) {
              if (board[r][c] === 0) {
                const nums = [1,2,3,4,5,6,7,8,9].sort(() => Math.random() - 0.5);
                for (let n of nums) {
                  if (isValid(board, r, c, n)) {
                    board[r][c] = n;
                    if (fillBoard(board)) return true;
                    board[r][c] = 0;
                  }
                }
                return false;
              }
            }
          }
          return true;
        };

        const generatePuzzle = (diff) => {
          const solution = Array.from({length: 9}, () => Array(9).fill(0));
          fillBoard(solution);
          const puzzle = solution.map(r => [...r]);
          let removed = 0;
          const target = { easy: 30, medium: 42, hard: 52 }[diff];
          while (removed < target) {
            const r = Math.floor(Math.random() * 9), c = Math.floor(Math.random() * 9);
            if (puzzle[r][c] !== 0) { puzzle[r][c] = 0; removed++; }
          }
          return { puzzle, solution };
        };

        function SudokuApp() {
          const [themeKey, setThemeKey] = useState("spring");
          const theme = THEMES[themeKey];
          const [difficulty, setDifficulty] = useState("medium");
          const [board, setBoard] = useState(null);
          const [solution, setSolution] = useState(null);
          const [puzzle, setPuzzle] = useState(null);
          const [selected, setSelected] = useState(null);
          const [timer, setTimer] = useState(0);
          const [active, setActive] = useState(false);
          const [paused, setPaused] = useState(false);

          const start = useCallback((d = difficulty) => {
            const { puzzle: p, solution: s } = generatePuzzle(d);
            setPuzzle(p); setSolution(s); setBoard(p.map(r => [...r]));
            setTimer(0); setActive(false); setPaused(false); setSelected(null);
          }, [difficulty]);

          useEffect(() => { start(); }, []);
          useEffect(() => {
            let inv;
            if (active && !paused) inv = setInterval(() => setTimer(t => t + 1), 1000);
            return () => clearInterval(inv);
          }, [active, paused]);

          const input = (n) => {
            if (!selected || paused) return;
            if (!active) setActive(true);
            const newBoard = board.map(r => [...r]);
            newBoard[selected.r][selected.c] = n;
            setBoard(newBoard);
            if (JSON.stringify(newBoard) === JSON.stringify(solution)) alert("Tebrikler! Süre: " + Math.floor(timer/60) + ":" + (timer%60));
          };

          if (!board) return null;

          return (
            <div className="flex flex-col h-full w-full overflow-hidden" style={{ backgroundColor: theme.bg, color: theme.text }}>
              {/* Üst Bar - Daha ince */}
              <div className="flex justify-between items-center px-4 py-2">
                <span className="font-bold tracking-tighter text-lg">sudoku</span>
                <div className="flex items-center gap-2">
                   <div className="text-xs font-mono bg-white/50 px-2 py-1 rounded-lg">
                    {Math.floor(timer/60).toString().padStart(2,'0')}:{(timer%60).toString().padStart(2,'0')}
                   </div>
                   <button onClick={() => setPaused(!paused)} className="text-sm px-2 py-1 rounded bg-white/50">{paused ? "▶" : "⏸"}</button>
                </div>
              </div>

              {/* Ana Oyun Alanı - Maksimum Alan */}
              <div className="flex-grow flex items-center justify-center p-2">
                <div className="w-full max-w-[95vw] aspect-square grid grid-cols-9 border-[2px]" style={{ borderColor: theme.primary, backgroundColor: theme.border }}>
                  {board.map((row, r) => row.map((cell, c) => {
                    const isSel = selected?.r === r && selected?.c === c;
                    const isGiv = puzzle[r][c] !== 0;
                    const isBlock = (Math.floor(r/3) + Math.floor(c/3)) % 2 === 0;
                    return (
                      <div key={`${r}-${c}`} onClick={() => !isGiv && setSelected({r,c})}
                        className="flex items-center justify-center text-xl sm:text-3xl border-[0.5px]"
                        style={{ 
                          backgroundColor: isSel ? theme.cellSelected : isBlock ? theme.cellBlock : theme.cellBg,
                          borderColor: theme.border,
                          color: isGiv ? theme.given : theme.user,
                          fontWeight: isGiv ? "700" : "400",
                          borderRight: (c + 1) % 3 === 0 && c !== 8 ? `2px solid ${theme.primary}` : "",
                          borderBottom: (r + 1) % 3 === 0 && row !== 8 ? `2px solid ${theme.primary}` : ""
                        }}>
                        {!paused && cell !== 0 ? cell : ""}
                      </div>
                    );
                  }))}
                </div>
              </div>

              {/* Alt Kontroller - Kompakt Tasarım */}
              <div className="safe-bottom bg-white/30 backdrop-blur-sm p-3">
                <div className="grid grid-cols-5 gap-1.5 max-w-sm mx-auto">
                  {[1,2,3,4,5,6,7,8,9,0].map(n => (
                    <button key={n} onClick={() => input(n)} 
                      className="numpad-btn aspect-[1.2/1] rounded-xl text-xl font-bold flex items-center justify-center shadow-sm"
                      style={{ backgroundColor: theme.cellBg, border: `1px solid ${theme.border}` }}>
                      {n === 0 ? "⌫" : n}
                    </button>
                  ))}
                </div>
                
                <div className="flex justify-center gap-4 mt-3">
                   {["easy", "medium", "hard"].map(d => (
                     <button key={d} onClick={() => {setDifficulty(d); start(d);}} 
                      className={`text-[10px] uppercase tracking-widest px-3 py-1 rounded-full ${difficulty === d ? 'bg-black/10 font-bold' : 'opacity-50'}`}>
                      {d}
                     </button>
                   ))}
                </div>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SudokuApp />);
    </script>
</body>
</html>
